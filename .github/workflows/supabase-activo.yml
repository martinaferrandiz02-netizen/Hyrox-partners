# Pairx · Mantener Supabase activo
# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Esta tarea hace una consulta pequeña cada día para que nunca se pause.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 * * *'   # cada día a las 06:17 UTC
  workflow_dispatch:        # para lanzarla a mano desde GitHub → Actions

jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ekvzcrdebryeqqhjlnfl.supabase.co/rest/v1/tiempos_referencia?select=division&limit=1" \
            -H "apikey: sb_publishable_SqjcHoJU-oh1yVKg2N6L5g_nNI01DpR")
          echo "Respuesta de Supabase: $code"
          test "$code" -lt 500
